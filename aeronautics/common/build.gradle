plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version

    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')

    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    api(project(":simulated:common")) {
        capabilities {
            requireCapability "$group:simulated"
        }
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Reduced 26.2 port: GuiGraphics and the neoforge model generators are gone.
sourceSets.main.java {
    exclude 'dev/eriksonn/aeronautics/data/AeroBlockStateGen.java'
    exclude 'dev/eriksonn/aeronautics/mixin/levitite/PonderUIMixin.java'
    exclude 'dev/eriksonn/aeronautics/content/ponder/**'
    exclude 'dev/eriksonn/aeronautics/content/blocks/hot_air/hot_air_burner/HotAirBurnerRenderer.java'
    exclude 'dev/eriksonn/aeronautics/content/particle/**'
    exclude 'dev/eriksonn/aeronautics/index/client/AeroRenderTypes.java'
    exclude 'dev/eriksonn/aeronautics/content/blocks/levitite/LevititeShaderManager.java'
    exclude 'dev/eriksonn/aeronautics/content/blocks/hot_air/balloon/effect/HeatedCulledRenderRegion.java'
    exclude 'dev/eriksonn/aeronautics/content/blocks/hot_air/balloon/effect/HeatedCulledRenderRegionBuilder.java'
    exclude 'dev/eriksonn/aeronautics/mixin/render/**'
    exclude 'dev/eriksonn/aeronautics/mixin/levitite/**'
    exclude 'dev/eriksonn/aeronautics/AeronauticsClient.java'
    exclude 'dev/eriksonn/aeronautics/events/AeronauticsClientEvents.java'
    exclude 'dev/eriksonn/aeronautics/index/AeroPonderScenes.java'
    exclude 'dev/eriksonn/aeronautics/index/AeroParticleTypes.java'
    exclude 'dev/eriksonn/aeronautics/content/blocks/hot_air/balloon/effect/ClientBalloonEffectRenderer.java'
}
