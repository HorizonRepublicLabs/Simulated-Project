plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    api(project(":simulated:common")) {
        capabilities {
            requireCapability "$group:simulated"
        }
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

/// The client render layer is staged out for 26.2 the same way the other
/// modules are: ponder needs simulated's staged-out ponder package, and the
/// renderers need render apis that have not been ported yet.
sourceSets.main.java {
    exclude 'dev/ryanhcode/offroad/content/ponder/**'
    exclude 'dev/ryanhcode/offroad/index/OffroadPonderScenes.java'
    exclude 'dev/ryanhcode/offroad/content/blocks/borehead_bearing/BoreheadBearingRenderer.java'
    exclude 'dev/ryanhcode/offroad/content/blocks/rock_cutting_wheel/RockCuttingWheelRenderer.java'
    exclude 'dev/ryanhcode/offroad/content/blocks/wheel_mount/WheelMountRenderer.java'
}
