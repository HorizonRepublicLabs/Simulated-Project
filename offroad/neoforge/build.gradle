plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

def generatedResources = project(":offroad:common").file("src/generated/resources")
def commonResources = project(":offroad:common").file("src/main/resources")

neoForge {
    version = neoforge_version

    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':offroad:common').file('src/main/resources/META-INF/accesstransformer.cfg')

    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "Offroad NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        // 26.2 splits datagen into a client and a server run, matching the
        // GatherDataEvent split; the providers here attach to the client one.
        clientData {
            clientData()
            gameDirectory = project.file('runs/data')
            programArguments.addAll '--all',
                    '--mod', 'offroad',
                    '--output', generatedResources.absolutePath,
                    '--existing', commonResources.absolutePath
        }
    }
    
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        simulated {
            sourceSet project(':simulated:neoforge').sourceSets.main
        }
    }
}

sourceSets.main.resources {
    srcDir generatedResources.absolutePath
}

/// common exports its whole source directory, so the loader repeats the
/// staged-out list in both the source set and its own compile task.
sourceSets.main.java {
    exclude 'dev/ryanhcode/offroad/content/ponder/**'
    exclude 'dev/ryanhcode/offroad/index/OffroadPonderScenes.java'
    exclude 'dev/ryanhcode/offroad/neoforge/OffroadNeoForgeClient.java'
}

tasks.named('compileJava', JavaCompile) {
    exclude 'dev/ryanhcode/offroad/content/ponder/**'
    exclude 'dev/ryanhcode/offroad/index/OffroadPonderScenes.java'
    exclude 'dev/ryanhcode/offroad/neoforge/OffroadNeoForgeClient.java'
}
