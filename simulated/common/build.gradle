plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version

    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')

    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Reduced 26.2 port: none of JEI, cc-tweaked, natures-compass, explorers-compass,
// sodium or iris has a 26.2 build, so the compat written against them is staged out.
sourceSets.main.java {
    exclude 'dev/simulated_team/simulated/compat/**'
    exclude 'dev/simulated_team/simulated/neoforge/compat/**'
    exclude 'dev/simulated_team/simulated/service/compat/**'
    exclude 'dev/simulated_team/simulated/neoforge/service/compat/**'
}
